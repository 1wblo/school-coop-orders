<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de commande</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/confirmation.css') }}">
</head>

<body class="confirmation">

    <header class="entete-form-conf">
        <div class="entete-deco">
            <a href="{{ url_for('index') }}" class="logo">
                <span>✎</span>
                <span class="logo-titre"><em>Equipement Scolaire ツ</em></span>
            </a>
        </div>
    </header>

    <main>

        <div class="carte-confirmation">
            <div class="icone-succes">
                <span>✔</span>
            </div>
            <h1>Commande confirmée !</h1>
            <p class="sous-titre" id="conf-merci"></p>
            <div class="details-commande">
                <div class="ligne-detail">
                    <span class="detail-label">Prénom</span>
                    <span class="detail-val" id="conf-prenom">—</span>
                </div>
                <div class="ligne-detail">
                    <span class="detail-label">Courriel</span>
                    <span class="detail-val" id="conf-courriel">—</span>
                </div>
                <div class="ligne-detail">
                    <span class="detail-label">Niveau</span>
                    <span class="detail-val" id="conf-niveau">—</span>
                </div>
                <div class="ligne-detail">
                    <span class="detail-label">Articles</span>
                    <span class="detail-val" id="conf-articles">—</span>
                </div>
                <hr class="separateur">
                <div class="ligne-detail sous-total">
                    <span class="detail-label">Sous-total</span>
                    <span class="detail-val" id="conf-sous-total">—</span>
                </div>
                <div class="ligne-detail rabais" id="conf-rabais-ligne">
                    <span class="detail-label">Rabais</span>
                    <span class="detail-val" id="conf-rabais">—</span>
                </div>
                <div class="ligne-detail total">
                    <span class="detail-label">Total à payer</span>
                    <span class="detail-val" id="conf-total">—</span>
                </div>
                <hr class="separateur">
                <div class="ligne-detail">
                    <span class="detail-label">Date et heure</span>
                    <span class="detail-val" id="conf-datetime">—</span>
                </div>
            </div>
            <p class="msg-remerciement">
                Merci pour votre confiance. Votre commande sera traitée dans les plus brefs délais.
            </p>
            <div class="zone-actions">
                <button class="btn-principal" id="btn-nouv-commande">Faire une nouvelle commande</button>
            </div>
        </div>

        <div class="section-admin">
            <div class="bloc-admin">
                <h2>Produits disponibles</h2>
                <ul id="liste-produits"></ul>
                <form id="form-ajout-produit">
                    <input type="text" id="input-nom-produit" placeholder="Nom du produit" required>
                    <input type="number" id="input-prix-produit" placeholder="Prix" min="0.01" step="0.01" required>
                    <button type="submit" class="btn-principal">Ajouter</button>
                </form>
            </div>
            <div class="bloc-admin">
                <h2>Commandes enregistrées</h2>
                <ul id="liste-commandes"></ul>
            </div>
        </div>

    </main>

    <script src="{{ url_for('static', filename='js/confirmation.js') }}"></script>
</body>

</html>
